<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drop — file jadi web</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>▲</text></svg>">
<style>
:root{--bg:#fafaf9;--fg:#111;--mute:#8a8a85;--line:#dcdcd7;--card:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0c0c0c;--fg:#f2f2f0;--mute:#77776f;--line:#2a2a28;--card:#141413}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}
main{width:100%;max-width:440px}
h1{font-size:15px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
p.sub{margin:0 0 20px;color:var(--mute)}
#drop{display:grid;place-items:center;text-align:center;height:220px;border:1.5px dashed var(--line);border-radius:14px;background:var(--card);cursor:pointer;transition:border-color .15s,transform .15s}
#drop:hover,#drop.over{border-color:var(--fg)}
#drop.over{transform:scale(.99)}
#drop b{display:block;font-weight:500}
#drop span{color:var(--mute);font-size:13px}
#res{display:none}
.row{display:flex;gap:8px;margin-top:12px}
.link{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg);text-decoration:none}
button{font:inherit;padding:11px 16px;border-radius:10px;border:0;background:var(--fg);color:var(--bg);cursor:pointer}
button.ghost{background:transparent;color:var(--mute);border:1px solid var(--line)}
#err{color:#d33;font-size:13px;min-height:20px;margin-top:10px}
.again{margin-top:14px;background:none;border:0;color:var(--mute);padding:0;font-size:13px;text-decoration:underline}
</style>
</head>
<body>
<main>
  <h1>Drop</h1>
  <p class="sub">Taruh file, langsung jadi link.</p>

  <label id="drop">
    <input id="file" type="file" hidden accept=".html,.htm,.pdf,.png,.jpg,.jpeg,.gif,.webp,.svg,.txt,.md">
    <div><b id="t">Drop file di sini</b><span id="s">atau klik · html, pdf, gambar · maks 4 MB</span></div>
  </label>

  <div id="res">
    <div class="row">
      <a class="link" id="url" target="_blank" rel="noopener"></a>
      <button id="copy">Salin</button>
    </div>
    <button class="again" id="again">Upload lagi</button>
  </div>
  <div id="err"></div>
</main>

<script>
const $=id=>document.getElementById(id);
const drop=$('drop'),file=$('file');

async function send(f){
  if(!f)return;
  $('err').textContent='';
  $('t').textContent='Mengupload…';
  try{
    const r=await fetch('/api/upload?name='+encodeURIComponent(f.name),{method:'POST',body:f});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Gagal upload');
    const full=location.origin+d.url;
    $('url').href=full;$('url').textContent=full.replace(/^https?:\/\//,'');
    drop.style.display='none';$('res').style.display='block';
  }catch(e){
    $('err').textContent=e.message;
    $('t').textContent='Drop file di sini';
  }
}

file.onchange=()=>send(file.files[0]);
['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>send(e.dataTransfer.files[0]));
addEventListener('paste',e=>send(e.clipboardData.files[0]));

$('copy').onclick=async()=>{
  await navigator.clipboard.writeText($('url').href);
  $('copy').textContent='Tersalin';setTimeout(()=>$('copy').textContent='Salin',1500);
};
$('again').onclick=()=>{$('res').style.display='none';drop.style.display='grid';$('t').textContent='Drop file di sini';file.value=''};
</script>
</body>
</html>
